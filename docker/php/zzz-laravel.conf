; Loaded after the official zz-docker.conf (do NOT replace that file —
; it sets [global] daemonize = no, which supervisord needs so php-fpm
; stays in the foreground under `php-fpm -F`).
[www]
; Keep Render-injected secrets visible to Laravel workers.
clear_env = no
; Match nginx fastcgi_pass 127.0.0.1:9000 (overrides image default listen = 9000).
listen = 127.0.0.1:9000
; Conservative pool size for Render free-tier memory limits.
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
catch_workers_output = yes
decorate_workers_output = no
